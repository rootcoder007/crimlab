# Publishing, on a version tag only (vX.Y.Z, the Version of DESCRIPTION),
# each registry its own job in the protected environment "release", whose
# required reviewers approve every run. Each job names the secrets of that
# environment it reads; without them it says so and publishes nothing.
# pkg.yml builds and tests every package on every change; the jobs here
# run only the tests a package needs before it leaves. The Python wheels
# go to PyPI from py.yml, which builds them.
name: publish

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions: {}

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  WASISDK: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
  WASISDKSUM: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4

jobs:
  versions:
    # every package carries the tag's version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: the tag, DESCRIPTION, the spec, the Debian changelog, Cargo.toml and package.json agree
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "Version: $v" DESCRIPTION
          grep -qx "Version:        $v" packaging/rpm/crimlab.spec
          grep -q "^crimlab ($v-" packaging/debian/changelog
          grep -qx "version = \"$v\"" bindings/rust/Cargo.toml
          grep -q "\"version\": \"$v\"" bindings/npm/package.json

  copr:
    # Fedora COPR; secret CLAB_COPR_CONFIG, the text of ~/.config/copr (the
    # project rootcoder007/crimlab must exist)
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    # fedora:latest
    container: docker.io/library/fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: tools
        run: dnf -y install rpm-build copr-cli git make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: the source RPM
        run: make -f .copr/Makefile srpm outdir="$PWD/out"
      - name: build on COPR (secret CLAB_COPR_CONFIG)
        env:
          CFG: ${{ secrets.CLAB_COPR_CONFIG }}
        run: |
          if [ -z "$CFG" ]; then
            echo "::warning::CLAB_COPR_CONFIG is not set: no COPR build"
            exit 0
          fi
          mkdir -p "$HOME/.config"
          (umask 077 && printf '%s\n' "$CFG" > "$HOME/.config/copr")
          unset CFG
          copr-cli build crimlab out/crimlab-*.src.rpm
          rm -f "$HOME/.config/copr"

  crate:
    # crates.io; secret CARGO_REGISTRY_TOKEN, a token scoped to
    # publish-update of crimlab
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: publish (secret CARGO_REGISTRY_TOKEN)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          sh tools/vendor.sh
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set: the crate is not published"
            cargo publish --dry-run --allow-dirty
            exit 0
          fi
          cargo publish --allow-dirty

  jnat:
    # the shared library for the Maven Central jar, per platform
    name: jnat ${{ matrix.pl }}
    needs: versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pl: linux-x86_64, os: ubuntu-22.04 }
          - { pl: linux-arm64, os: ubuntu-22.04-arm }
          - { pl: macos-arm64, os: macos-15 }
          - { pl: macos-x86_64, os: macos-15-intel }
          - { pl: windows-x86_64, os: windows-2025, a: x64 }
          - { pl: windows-arm64, os: windows-2025, a: x64_arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: build (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          PL: ${{ matrix.pl }}
        run: |
          MACOSX_DEPLOYMENT_TARGET=11.0 make -C cli -j4 CXXFLAGS=-O2 all
          mkdir -p "out/native/$PL"
          case $PL in
          macos-*) cp cli/libcrimlab.0.dylib "out/native/$PL/libcrimlab.dylib" ;;
          *) cp cli/libcrimlab.so.0 "out/native/$PL/libcrimlab.so" ;;
          esac
      - name: the kernels (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir b
          grep -L -E '#[[:space:]]*include[[:space:]]*[<"](R\.h|Rinternals\.h|Rmath\.h|R_ext/|rchk\.h)' src/*.cpp > b/k.rsp
      - name: build (Windows; the C runtime linked in, /MT)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          A: ${{ matrix.a }}
          PL: ${{ matrix.pl }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" %A%
          mkdir out\native\%PL%
          cl /nologo /LD /MT /std:c++17 /EHsc /O2 /Isrc @b\k.rsp cli\jrun.cpp /Fob\ /Feout\native\%PL%\crimlab.dll /link /EXPORT:clab_jrun /EXPORT:clab_jfns || exit /b 1
          del out\native\%PL%\crimlab.lib out\native\%PL%\crimlab.exp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jnat-${{ matrix.pl }}
          path: out
          if-no-files-found: error
          retention-days: 7

  maven:
    # io.github.rootcoder007:crimlab: the jar with all six libraries, the
    # sources and javadoc jars and the POM, signed and uploaded to the
    # Central Portal. The jar's own copy of the library passes the tests
    # first. Secrets CLAB_MAVEN_USER and CLAB_MAVEN_PASS (a Central Portal
    # user token), CLAB_MAVEN_GPG_KEY and CLAB_MAVEN_GPG_PASS (the signing
    # key, armoured).
    needs: jnat
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bindings/java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jnat-*
          merge-multiple: true
          path: bindings/java/jn
      - name: the jars and the POM
        run: |
          v=${GITHUB_REF_NAME#v}
          n=$(find jn/native -type f | wc -l)
          [ "$n" -eq 6 ] || { echo "::error::expected 6 libraries, found $n"; exit 1; }
          d="m/io/github/rootcoder007/crimlab/$v"
          mkdir -p "$d" c t
          # shellcheck disable=SC2046 # no path has a space
          javac --release 22 -Xlint:all -Werror -d c $(find src/main/java -name '*.java')
          cp -R jn/native c/
          cp ../../LICENSE ../../NOTICE c/
          jar --create --file "$d/crimlab-$v.jar" -C c .
          jar --create --file "$d/crimlab-$v-sources.jar" -C src/main/java . -C ../.. LICENSE
          # shellcheck disable=SC2046
          javadoc -quiet -d jd $(find src/main/java -name '*.java')
          jar --create --file "$d/crimlab-$v-javadoc.jar" -C jd .
          sed "s/@VERSION@/$v/" pom.xml.in > "$d/crimlab-$v.pom"
          # shellcheck disable=SC2046
          javac --release 22 -cp "$d/crimlab-$v.jar" -d t $(find src/test/java -name '*.java')
          env -u CRIMLAB_LIBRARY java --enable-native-access=ALL-UNNAMED \
            -cp "$d/crimlab-$v.jar:t" io.github.rootcoder007.crimlab.Tests
          ls -l "$d"
      - name: sign, checksums, bundle (secrets CLAB_MAVEN_GPG_KEY, CLAB_MAVEN_GPG_PASS)
        env:
          KEY: ${{ secrets.CLAB_MAVEN_GPG_KEY }}
          PASS: ${{ secrets.CLAB_MAVEN_GPG_PASS }}
        run: |
          d="m/io/github/rootcoder007/crimlab/${GITHUB_REF_NAME#v}"
          if [ -z "$KEY" ]; then
            echo "::warning::CLAB_MAVEN_GPG_KEY is not set: nothing is signed or uploaded"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          (umask 077 && mkdir -p "$GNUPGHOME")
          printf '%s\n' "$KEY" | gpg --batch --quiet --import
          unset KEY
          for f in "$d"/*; do
            printf '%s' "$PASS" | gpg --batch --yes --quiet --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign "$f"
          done
          for f in "$d"/*.jar "$d"/*.pom; do
            md5sum "$f" | cut -d' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
          done
          (cd m && zip -q -r ../bundle.zip io)
          unzip -l bundle.zip
      - name: upload to the Central Portal (secrets CLAB_MAVEN_USER, CLAB_MAVEN_PASS)
        env:
          U: ${{ secrets.CLAB_MAVEN_USER }}
          P: ${{ secrets.CLAB_MAVEN_PASS }}
        run: |
          if [ ! -f bundle.zip ] || [ -z "$U" ] || [ -z "$P" ]; then
            echo "::warning::Maven Central secrets are not all set: nothing is uploaded"
            exit 0
          fi
          auth="Authorization: Bearer $(printf '%s:%s' "$U" "$P" | base64 -w0)"
          unset U P
          id=$(curl -fsS -X POST -H "$auth" -F "bundle=@bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=crimlab-${GITHUB_REF_NAME#v}&publishingType=AUTOMATIC")
          echo "deployment $id"
          for _ in $(seq 1 60); do
            curl -fsS -X POST -H "$auth" -o status.json \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id"
            s=$(python3 -c 'import json; print(json.load(open("status.json"))["deploymentState"])')
            echo "state: $s"
            case $s in
            PUBLISHING | PUBLISHED) exit 0 ;;
            FAILED) echo "::error::Central rejected the deployment $id"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::deployment $id still not validated after 30 minutes"
          exit 1
  npm:
    # npmjs.com by trusted publishing, with provenance: no secret; crimlab's
    # trusted publisher names this repository, publish.yml and the
    # environment release
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    defaults:
      run:
        working-directory: bindings/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: wasi-sdk (checked against its SHA-256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.tgz" "$WASISDK"
          printf '%s  %s\n' "$WASISDKSUM" "$RUNNER_TEMP/sdk.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/sdk.tgz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - name: build and test
        run: sh build.sh && npm test
      - name: publish
        run: npm publish --provenance --access public

