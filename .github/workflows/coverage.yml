# Test coverage of R/ and src/ with covr: the job fails when it falls
# below the floor, and the line-by-line report goes to Codecov, which
# shows it per file and per change. The upload is signed with the
# workflow's own identity (OIDC), so the repository holds no token for
# it; an upload that fails does not fail the job, the floor does.
# Four lines of src/core.cpp cannot be reached from R: clab_strerror()
# for CLAB_OK and for an unknown code (the binding asks for words only
# when a kernel fails, and the kernels return no other code).
name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the Codecov upload's identity; nothing else uses it

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      FLOOR: "99.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::covr
          needs: coverage
      - name: A Latin-1 locale
        # the test of text in a session's own encoding needs one, and the
        # runner has none: without it the lines that accept such text never run
        run: sudo localedef -i en_US -f ISO-8859-1 en_US.ISO-8859-1
      - name: Coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")
          # not covr::zero_coverage(): outside a terminal it wants rstudioapi
          z <- covr::tally_coverage(cov)
          z <- z[z[["value"]] == 0, c("filename", "line")]
          if (nrow(z)) print(z, row.names = FALSE)
          pct <- covr::percent_coverage(cov)
          floor <- as.numeric(Sys.getenv("FLOOR"))
          cat(sprintf("coverage %.2f%%, floor %.1f%%\n", pct, floor))
          if (pct < floor) {
            cat("::error::coverage below the floor\n")
            quit(status = 1L)
          }
      - name: Report to Codecov
        if: always() && hashFiles('cobertura.xml') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          slug: rootcoder007/crimlab
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
