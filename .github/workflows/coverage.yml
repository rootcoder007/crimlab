# Test coverage of R/ and src/ with covr, computed here and nowhere else:
# the job fails when it falls below the floor. Nothing is uploaded.
# Four lines of src/core.cpp cannot be reached from R: csls_strerror()
# for CSLS_OK and for an unknown code (the binding asks for words only
# when a kernel fails, and the kernels return no other code).
name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      FLOOR: "99.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::covr
          needs: coverage
      - name: Coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          # not covr::zero_coverage(): outside a terminal it wants rstudioapi
          z <- covr::tally_coverage(cov)
          z <- z[z[["value"]] == 0, c("filename", "line")]
          if (nrow(z)) print(z, row.names = FALSE)
          pct <- covr::percent_coverage(cov)
          floor <- as.numeric(Sys.getenv("FLOOR"))
          cat(sprintf("coverage %.2f%%, floor %.1f%%\n", pct, floor))
          if (pct < floor) {
            cat("::error::coverage below the floor\n")
            quit(status = 1L)
          }
