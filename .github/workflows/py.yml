# The Python package (py/): built with warnings as errors and tested on
# Linux (x86-64, arm64), macOS and Windows for the oldest and the newest
# Python it supports; stable-ABI wheels (cibuildwheel) and an sdist are
# built, checked and installed in clean environments. Wheels and the sdist
# are kept as workflow artifacts; only a version tag (vX.Y.Z) publishes
# them, from the job pypi, in the protected environment "release" and by
# trusted publishing (no token: PyPI's trusted publisher for crimlab names
# this repository, py.yml and the environment release).
name: py

on:
  workflow_dispatch:
  push:
    branches: [main]
    # a tag push ignores the paths below
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
    paths: ['src/**', 'py/**', 'inst/lean/**', 'DESCRIPTION', 'LICENSE', 'NOTICE',
            '.github/workflows/py.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'py/**', 'inst/lean/**', 'DESCRIPTION', 'LICENSE', 'NOTICE',
            '.github/workflows/py.yml']

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
        python: ['3.10', '3.15']
        # every version between the two ends, once, on Linux
        include:
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: ubuntu-24.04, python: '3.14'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install, warnings as errors
        shell: bash
        # setup.py adds -Werror or /WX; CXXFLAGS would replace Python's own
        # compile flags, -O2 among them
        env:
          CLAB_WERROR: '1'
        run: python -m pip install -v ./py 2>&1 | tail -n 40
      - name: Test dependencies
        # pytest only: the package and its tests need nothing else
        run: python -m pip install pytest
      - name: Tests
        working-directory: py/tests
        # every allocation inside the compiled module failed in turn
        # (CLAB_NOMEM=1): minutes, so on one job only, and on 3.13 because
        # CPython 3.15.2 aborts when an allocation fails in its own code
        env:
          CLAB_NOMEM: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.13' && '1' || '0' }}
        run: python -X dev -m pytest -q -ra
      - name: Optional packages
        # NumPy, pandas and matplotlib work with crimlab without being
        # imported by it: tests/opt.py, the one file that imports them
        working-directory: py/tests
        run: |
          python -m pip install numpy pandas matplotlib
          python -m pytest -q -ra opt.py
      - name: Doctests
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q --doctest-modules --pyargs crimlab -o doctest_optionflags=NORMALIZE_WHITESPACE
      - name: README examples
        # from another directory, so that crimlab is the installed package
        # and not the source folder py/crimlab, which has no compiled module
        working-directory: ${{ runner.temp }}
        run: python -m pytest -q -p no:cacheprovider --doctest-glob=README.md "${{ github.workspace }}/py/README.md" -o doctest_optionflags=NORMALIZE_WHITESPACE

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: py
          output-dir: wheelhouse
        env:
          # one stable-ABI wheel per platform, built with the oldest Python;
          # cibuildwheel runs abi3audit on it
          CIBW_BUILD: cp310-*
          CIBW_ARCHS: auto64
          CIBW_ARCHS_MACOS: arm64 x86_64
          CIBW_ENVIRONMENT: CLAB_WERROR=1
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest -q {package}/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Build the sdist
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist py
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The artifacts as a user gets them: twine check, then the Linux wheel
  # and the sdist each installed in a clean environment of the newest
  # Python and tested with the tests the sdist carries, outside the
  # repository.
  check:
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: twine check
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
      - name: Wheel in a clean environment
        run: |
          mkdir t && tar xzf dist/*.tar.gz -C t --strip-components 1
          python -m venv w
          w/bin/python -m pip install --only-binary :all: --no-index --find-links dist crimlab
          w/bin/python -m pip install pytest
          cd t/tests && ../../w/bin/python -m pytest -q
      - name: sdist in a clean environment
        run: |
          python -m venv s
          s/bin/python -m pip install --no-binary crimlab dist/*.tar.gz pytest
          cd t/tests && ../../s/bin/python -m pytest -q

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: the tag is the version of every file
        run: |
          v=${GITHUB_REF_NAME#v}
          ls dist
          for f in dist/*; do
            case $(basename "$f") in crimlab-"$v"-* | crimlab-"$v".tar.gz) ;; *) echo "::error::$f is not $v"; exit 1 ;; esac
          done
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
