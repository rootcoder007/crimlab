# goodpractice, every check but two: lintr (80 columns), cyclomatic
# complexity (15 at most per function), roxygen, test file names, the
# DESCRIPTION fields and the rest. Any failed check fails the job.
# Its covr and rcmdcheck checks are left out: coverage.yml and check.yml
# run the same work on every push.
name: goodpractice

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goodpractice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goodpractice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      PKG_USE_BIOCONDUCTOR: "false"
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::goodpractice, any::curl
          needs: check

      - name: goodpractice (all but covr and rcmdcheck)
        shell: Rscript {0}
        run: |
          ck <- goodpractice::all_checks()
          ck <- ck[!grepl("^(covr|rcmdcheck)", ck)]
          g <- goodpractice::gp(".", checks = ck)
          print(g)
          failed <- goodpractice::failed_checks(g)
          # urlchecker gives every address 5 seconds, so a slow server reads
          # as a broken link. Each address it flagged is asked again with 60
          # seconds and three tries; one still unreachable, or answering
          # 4xx/5xx, fails the job. While the repository is private its own
          # pages answer 404 to an anonymous client, so an address in this
          # repository is asked of the GitHub API with the job's token.
          if ("urlchecker_ok" %in% failed) {
            db <- g$urlchecker
            urls <- unique(db$URL[db$Status != "200"])
            own <- paste0("https://github.com/", Sys.getenv("GITHUB_REPOSITORY"))
            ok <- vapply(urls, function(u) {
              mine <- startsWith(u, own)
              # the job's token reads the repository, not its issues, so a
              # page of this repository is good when the repository answers
              if (mine) {
                u <- paste0("https://api.github.com/repos/",
                            Sys.getenv("GITHUB_REPOSITORY"))
              }
              for (k in 1:3) {
                h <- curl::new_handle(timeout = 60, followlocation = TRUE)
                if (mine) {
                  curl::handle_setheaders(
                    h, Authorization = paste("Bearer", Sys.getenv("GITHUB_PAT"))
                  )
                }
                r <- tryCatch(
                  curl::curl_fetch_memory(u, handle = h)$status_code,
                  error = function(e) NA_integer_
                )
                if (!is.na(r) && r < 400L) return(TRUE)
                Sys.sleep(10)
              }
              FALSE
            }, NA)
            for (u in urls) cat(if (ok[[u]]) "reachable:" else "BROKEN:", u, "\n")
            if (all(ok)) failed <- setdiff(failed, "urlchecker_ok")
          }
          if (length(failed)) {
            cat("failed checks:", paste(failed, collapse = ", "), "\n")
            quit(status = 1L)
          }
