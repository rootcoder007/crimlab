# The command-line program (cli/) and the packages built from the kernels,
# each built, installed or tested in its own job. Builds and tests only:
# publish.yml publishes, on a release tag.
name: pkg

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'cli/**', 'bindings/**', 'packaging/**', '.copr/**', 'DESCRIPTION',
            '.github/workflows/pkg.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'cli/**', 'bindings/**', 'packaging/**', '.copr/**', 'DESCRIPTION',
            '.github/workflows/pkg.yml']

permissions:
  contents: read

env:
  WASISDK: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
  WASISDKSUM: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4

jobs:
  cli:
    name: cli (${{ matrix.os }}, ${{ matrix.cxx }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++ }
          - { os: ubuntu-24.04, cxx: clang++ }
          - { os: ubuntu-24.04-arm, cxx: g++ }
          - { os: macos-15, cxx: clang++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: cli/thm.inc is the proof table of src/bind.cpp
        run: sh cli/thm.sh | diff cli/thm.inc -
      - name: build, warnings as errors
        run: make -C cli -j4 CXX=${{ matrix.cxx }}
      - name: tests
        run: make -C cli check
      - name: tests under AddressSanitizer and UndefinedBehaviorSanitizer
        if: matrix.os == 'ubuntu-24.04' && matrix.cxx == 'clang++'
        run: |
          make -C cli clean
          make -C cli -j4 CXX=clang++ crimlab \
            CXXFLAGS="-O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all" \
            LDFLAGS="-fsanitize=address,undefined"
          make -C cli check

  msvc:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: the kernels (every src/*.cpp without R's headers, the rule of py/setup.py)
        shell: bash
        run: |
          mkdir b
          grep -L -E '#[[:space:]]*include[[:space:]]*[<"](R\.h|Rinternals\.h|Rmath\.h|R_ext/|rchk\.h)' src/*.cpp > b/k.rsp
          cat b/k.rsp
      - name: build with cl, /W4 /WX for cli/ (the kernels at /W3 /WX, as py.yml builds them)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /c /std:c++17 /EHsc /O2 /W3 /WX /Fob\ @b\k.rsp || exit /b 1
          cl /nologo /c /std:c++17 /EHsc /O2 /W4 /WX /D_CRT_SECURE_NO_WARNINGS /Isrc /Fob\ cli\jrun.cpp cli\main.cpp || exit /b 1
          cl /nologo /Fecli\crimlab.exe b\*.obj || exit /b 1
      - name: tests
        shell: bash
        run: sh cli/test.sh cli/crimlab.exe

  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # fedora:latest
    container: docker.io/library/fedora@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: tools
        run: dnf -y install rpm-build rpmlint gcc-c++ make git gawk glibc-langpack-en
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: the source RPM, as COPR makes it, and the RPMs from it
        run: |
          make -f .copr/Makefile srpm outdir="$PWD/out"
          rpmbuild --rebuild --define "_rpmdir $PWD/out" out/*.src.rpm
          ls -lR out
      - name: rpmlint
        run: rpmlint -r packaging/rpm/crimlab.rpmlintrc packaging/rpm/crimlab.spec out/*.src.rpm out/*/*.rpm
      - name: install and run
        run: |
          dnf -y install out/*/crimlab-[0-9]*.rpm out/*/crimlab-devel-*.rpm
          crimlab -V
          crimlab selftest
          crimlab orrisk --or 2 --rate 0.1 --share 0.3
          test -f /usr/include/crimlab/jrun.h

  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: the Build-Depends of debian/control (build-essential with them), and lintian
        run: |
          sudo apt-get update -q
          mkdir "$RUNNER_TEMP/bd"
          cp -R packaging/debian "$RUNNER_TEMP/bd/debian"
          sudo apt-get build-dep -y -q "$RUNNER_TEMP/bd"
          sudo apt-get install -y -q --no-install-recommends lintian
      - name: build and lintian
        run: sh packaging/deb.sh out
      - name: install and run
        run: |
          sudo apt-get install -y -q ./out/*.deb
          crimlab -V
          crimlab selftest
          crimlab orrisk --or 2 --rate 0.1 --share 0.3
          test -f /usr/include/crimlab/jrun.h
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: out/*.deb
          if-no-files-found: error
          retention-days: 7

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: tests
        run: cargo test
      - name: the packaged crate builds on its own
        if: runner.os == 'Linux'
        run: |
          sh tools/vendor.sh
          cargo package --allow-dirty --list
          cargo package --allow-dirty
          ls -l target/package/*.crate

  java:
    name: java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - name: build and test, with the library given and from the jar
        run: JOBS=4 sh bindings/java/build.sh test bundled

  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    defaults:
      run:
        working-directory: bindings/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: the copy of the kernels in csrc/ is current (tools/vendor.sh changes nothing)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sh tools/vendor.sh
          git add -A .
          git diff --cached --exit-code --stat .
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: tests, with the table of cli/test.tsv
        run: go test -count=1 ./...

  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bindings/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: wasi-sdk (checked against its SHA-256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.tgz" "$WASISDK"
          printf '%s  %s\n' "$WASISDKSUM" "$RUNNER_TEMP/sdk.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/wasi-sdk"
          tar -xzf "$RUNNER_TEMP/sdk.tgz" -C "$RUNNER_TEMP/wasi-sdk" --strip-components=1
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk" >> "$GITHUB_ENV"
      - name: build
        run: sh build.sh
      - name: tests
        run: npm test
      - name: the package, installed from its tarball
        run: |
          npm pack
          mkdir "$RUNNER_TEMP/t" && cd "$RUNNER_TEMP/t"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/bindings/npm/crimlab-*.tgz
          npx --offline crimlab orrisk --or 2 --rate 0.1 --share 0.3
          node --input-type=module -e 'import c from "crimlab"; if (c.selftest().nfail !== 0) process.exit(1)'
