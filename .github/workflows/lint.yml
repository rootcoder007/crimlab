# lintr over R/ and tests/ with .lintr; any lint fails the job.
name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lintr:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint
      - name: every source is in one group of the unity build
        run: python3 dev/unity.py check

      - name: the first page of the PDF manual lets its lines stretch
        run: |
          f=$(grep -L "keyword{internal}" man/*.Rd | LC_ALL=C sort | head -n 1)
          grep -q "emergencystretch" "$f" || { echo "::error::$f is the first page of the manual and lacks the line of R/agemix.R"; exit 1; }

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
