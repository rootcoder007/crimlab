# R CMD check on the platforms CRAN and rOpenSci look at.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} (${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, r: release}
          - {os: ubuntu-24.04, r: devel}
          - {os: ubuntu-24.04, r: oldrel-1}
          # the oldest R the DESCRIPTION admits, with the hard dependencies
          # and the test and vignette tools only: the suggested spatial
          # packages are not all installable there, and their tests skip
          - {os: ubuntu-24.04, r: '4.1', deps: '"hard"',
             extra: 'any::rcmdcheck, any::testthat, any::knitr, any::rmarkdown'}
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # R CMD build renders the vignette with pandoc
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: ${{ matrix.extra || 'any::rcmdcheck' }}
          dependencies: ${{ matrix.deps || '"all"' }}
          needs: check
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.deps && 'false' || 'true' }}
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
