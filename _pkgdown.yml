      - hitscr
      - spwt
      - gearc
      - gorg
      - lmorn
      - locgi
      - dirmn
      - gstr
      - sptst
  - title: Risk tools and predictive policing
    desc: Fairness metrics of a binary risk tool by group; differences
      between groups with intervals, over time and place;
      calibration of an area ranking and a score's spread across groups;
      individual fairness; bounds under label noise, Chouldechova's
      identity and the resolution of a ranking; the Oaxaca-Blinder
      decomposition; simulated records with a known disparity.
    contents:
      - fairdf
      - tmpaud
      - calaud
      - scrdsp
      - lipaud
      - nsbnd
      - impfpr
      - rnkres
      - oaxbd
      - fairsim
      - nordet
      - fair
      - xpshap
      - xpale
      - xpcp
      - xppdp
      - xpimp
  - title: Plots
    desc: A plot() method for every result with something to draw, the
      palettes and session look they share, and general plots of
      distributions, concentration and series over time.
    contents:
      - plotm
      - blpal
      - plotlrnz
      - plotrdg
      - plotcal
      - plotevgrid
  - title: Checks
    desc: Which labelling of a table reproduces a reported contrast, and an
      audit of categorical inputs.
    contents:
      - relchk
      - catchk
  - title: Counts, rates and tables
    desc: Rate ratios from count regression with exposure and clusters;
      rates and proportions by group with exact and approximate intervals;
      direct and indirect standardisation; cross-tabulation with tests
      and measures of association.
    contents:
      - cntreg
      - grprr
      - dastd
      - sirex
      - ctabx
  - title: Police-reported crime
    desc: Severity-weighted crime indices and composite indices of standardised
      counts; Benford screens of reported figures and agencies that report
      the same count every month.
    contents:
      - crsev
      - zcomp
      - rptvic
      - bdig
      - rptc
  - title: Concentration
    desc: How unequally crime is spread across places, people or units, what
      chance alone would show, and the tail of a heavy-tailed count.
    contents:
      - cconc
      - hilltl
  - title: Dark figure
    desc: Capture-recapture from two or three lists, and bounds on the crime
      that is never recorded.
    contents:
      - crcap
      - dkfig
  - title: Published tables
    desc: Banded categories, the bounds that rounding and suppression leave, and
      period-over-period change with exact tests.
    contents:
      - bandx
      - pbbnd
      - yoypx
      - tabrpt
  - title: Courts and sentencing
    desc: The judge-leniency instrument and its monotonicity, and sentences
      against a mandatory minimum.
    contents:
      - jdgiv
      - jmono
      - mmshr
      - pscred
      - gologt
      - gocoef
  - title: Life course and the justice pipeline
    desc: Age-crime curves of a mixture of types, the cumulative risk of a first
      event by age, and lagged rates between stages; group-based
      trajectory models (zero-inflated Poisson and multivariate normal).
    contents:
      - agemix
      - cumrsk
      - apcie
      - jpipe
      - zgll
      - mvtll
  - title: Segregation and the Mandela Rules
    desc: Placements that meet the Mandela Rules' limits on solitary
      confinement, by group and denominator.
    contents:
      - mndla
  - title: Custody and court flow
    desc: Stocks and flows of people held, lengths of stay, Little's law on a
      docket, case flow and outcome mix, life tables of grouped times, and
      moves between states.
    contents:
      - stkflw
      - lostay
      - bklog
      - dktflw
      - lftab
      - trnmat
  - title: Presets
    desc: A published dataset's columns onto a generic function's arguments.
    contents:
      - clprep
      - prechk
      - synfix
  - title: Learning
    desc: The elastic net with cross-validation, logistic regression,
      random forests and their stack, the super learner; the learners of
      the cross-fitted estimators.
    contents:
      - enpath
      - lgtreg
      - rfor
      - suplrn
  - title: Causal estimates
    desc: Double machine learning by cross-fitting, with the learners above;
      augmented inverse probability weighting and targeted maximum
      likelihood from the same nuisances; Rosenbaum bounds on the
      sensitivity of a matched comparison.
    contents:
      - dmlx
      - ulcate
      - cbatt
      - smdbal
      - evlx
      - rswp
      - dagcol
  - title: Indigenous health and wellbeing
    desc: First Nations, Metis and Inuit health, mental health and wellbeing
      from Statistics Canada's published tables, read as published and
      compared distinction by distinction, the frameworks for wellness put
      to work on them, the 2021 Census Indigenous Population Profile, and the
      Truth and Reconciliation Commission's Calls to Action.
