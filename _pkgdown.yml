url: https://rootcoder007.github.io/crimlab/
repo:
  url:
    home: https://github.com/rootcoder007/crimlab/
    source: https://github.com/rootcoder007/crimlab/blob/main/
    issue: https://github.com/rootcoder007/crimlab/issues/
template:
  bootstrap: 5

articles:
  - title: Guides
    navbar: ~
    contents:
      - crimlab

reference:
  - title: Disparities
    desc: Veil of darkness, odds ratios and risks, the outcome test,
      benchmarks and dyadic rates.
    contents:
      - vodtst
      - orrisk
      - outtst
      - dspbm
      - dyadrt
  - title: Forensics
    desc: DNA match statistics, the weight and calibration of likelihood
      ratios, kinship, paternity, mixtures and database searches.
    contents:
      - gtmp
      - lrpost
      - cllr
      - cllrmin
      - lrcal
      - tipplt
      - eceplt
      - mixlr
      - kinidx
      - patidx
      - dbsrch
  - title: Policing
    desc: Clearance rates, exposure proxies, misrecorded groups and
      regression to the mean.
    contents:
      - clrsmp
      - expbnd
      - misrd
      - rtmhs
  - title: Corrections
    desc: Incapacitation, release rules, time in custody, sentence effects
      and hazards after selection.
    contents:
      - incap
      - incapr
      - sellab
      - losbnd
      - sntbnd
      - hzdsel
  - title: Networks
    desc: Co-offending graphs, centrality, cores, components, communities,
      brokerage and the Cheeger bounds.
    contents:
      - coofg
      - ntdeg
      - ntbtw
      - ntcls
      - ntevc
      - ntcore
      - ntcmp
      - ntlvn
      - ntmod
      - ntbrk
      - ntchg
  - title: Spatial
    desc: Distances and projection, centrography, nearest neighbours and K
      functions, hot spots, space-time tests and journey to crime.
    contents:
      - hvdist
      - eqproj
      - cgstat
      - cgmedn
      - webpt
      - sdell
      - cvhull
      - nnidx
      - ripk
      - ripenv
      - fzmode
      - kmpart
      - nnhclu
      - stacel
      - rnnhcl
      - hdbang
      - crwalk
      - mantst
      - stmavg
      - jtdecay
      - jtsurf
      - jtcal
      - jtacc
      - bjtc
      - spwt
      - gearc
      - gorg
      - lmorn
      - locgi
      - dirmn
  - title: Dossier methods
    desc: Fairness of risk tools, trace evidence, aoristic time, Benford
      screens, glass grouping and transfer, constant reporters,
      sensitivity bounds, trajectory models, lowess, tool marks, grid
      Gi* and the point pattern test.
    contents:
      - fair
      - tlvc
      - aorwt
      - bdig
      - skp
      - rptc
      - rswp
      - zgll
      - mvtll
      - tfrp
      - lwss
      - chmb
      - gstr
      - sptst
  - title: Risk tools and predictive policing
    desc: Differences between groups with intervals, over time and place;
      calibration of an area ranking and a score's spread across groups;
      individual fairness; bounds under label noise, Chouldechova's
      identity and the resolution of a ranking; the Oaxaca-Blinder
      decomposition; simulated records with a known disparity.
    contents:
      - fairdf
      - tmpaud
      - calaud
      - scrdsp
      - lipaud
      - nsbnd
      - impfpr
      - rnkres
      - oaxbd
      - fairsim
      - nordet
  - title: Checks
    desc: Which labelling of a table reproduces a reported contrast, and an
      audit of categorical inputs.
    contents:
      - relchk
      - catchk
  - title: Counts, rates and tables
    desc: Rate ratios from count regression with exposure and clusters;
      rates and proportions by group with exact and approximate intervals;
      direct and indirect standardisation; cross-tabulation with tests
      and measures of association.
    contents:
      - cntreg
      - grprr
      - dastd
      - sirex
      - ctabx
  - title: Police-reported crime
    desc: Severity-weighted crime indices and composite indices of standardised
      counts.
    contents:
      - crsev
      - zcomp
  - title: Concentration
    desc: How unequally crime is spread across places, people or units, what
      chance alone would show, and the tail of a heavy-tailed count.
    contents:
      - cconc
      - hilltl
  - title: Dark figure
    desc: Capture-recapture from two or three lists, and bounds on the crime
      that is never recorded.
    contents:
      - crcap
      - dkfig
  - title: Published tables
    desc: Banded categories, the bounds that rounding and suppression leave, and
      period-over-period change with exact tests.
    contents:
      - bandx
      - pbbnd
      - yoypx
  - title: Courts and sentencing
    desc: The judge-leniency instrument and its monotonicity, and sentences
      against a mandatory minimum.
    contents:
      - jdgiv
      - jmono
      - mmshr
  - title: Life course and the justice pipeline
    desc: Age-crime curves of a mixture of types, the cumulative risk of a first
      event by age, and lagged rates between stages.
    contents:
      - agemix
      - cumrsk
      - jpipe
  - title: Segregation and the Mandela Rules
    desc: Placements that meet the Mandela Rules' limits on solitary
      confinement, by group and denominator.
    contents:
      - mndla
  - title: Presets
    desc: A published dataset's columns onto a generic function's arguments.
    contents:
      - clprep
  - title: Learning
    desc: The elastic net with cross-validation, logistic regression and
      random forests; the learners of the cross-fitted estimators.
    contents:
      - enpath
      - lgtreg
      - rfor
  - title: Causal estimates
    desc: Double machine learning by cross-fitting, with the learners above;
      augmented inverse probability weighting and targeted maximum
      likelihood from the same nuisances.
    contents:
      - dmlx
      - cbatt
      - smdbal
      - evlx
  - title: Policy evaluation
    desc: Difference in differences with fixed effects, event studies,
      staggered adoption, synthetic controls and synthetic difference in
      differences.
    contents:
      - didfe
      - evtst
      - stgdid
      - synthc
      - sdidx
      - wcbx
      - wystep
  - title: Time, contagion and operations
    desc: Self-exciting processes, trends and change points in series,
      recurrence, hot-spot dynamics and patrol queues.
    contents:
      - hwkfit
      - hwkres
      - hwksim
      - trndrr
      - stpcp
      - cusrv
      - xcser
      - kmrec
      - hypq
      - sqrtlw
      - sdbsim
      - sdbthr
      - etasf
      - mvhwk
      - sthwk
  - title: Surveys
    desc: Design-based means, totals, proportions, ratios and variances by
      domain from stratified, clustered and weighted samples.
    contents:
      - svymx
  - title: Proofs
    contents:
      - proof
  - title: Package
    contents:
      - crimlab-package
  - title: Spatial crime analysis
    desc: Near repeats, kernel surfaces, DBSCAN and hot-spot persistence,
      the space-time scan, global and bivariate Moran, spatial regression
      and its effects, point patterns and segregation, points in polygons,
      areal crosswalks and buffer designs.
    contents:
      - knxnr
      - kdsurf
      - dbscn
      - hsper
      - ebshr
      - kscan
      - gmoran
      - bvmor
      - sarml
      - spill
      - crossk
      - qdrtst
      - morsta
      - dissix
      - pinpl
      - arwt
      - bufas
