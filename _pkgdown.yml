url: https://rootcoder007.github.io/crimlab/
repo:
  url:
    home: https://github.com/rootcoder007/crimlab/
    source: https://github.com/rootcoder007/crimlab/blob/main/
    issue: https://github.com/rootcoder007/crimlab/issues/
template:
  bootstrap: 5

articles:
  - title: Guides
    navbar: ~
    contents:
      - crimlab

reference:
  - title: Disparities
    desc: Veil of darkness, odds ratios and risks, the outcome test,
      benchmarks and dyadic rates.
    contents:
      - vodtst
      - orrisk
      - outtst
      - thrtst
      - ibench
      - dspbm
      - dyadrt
  - title: Forensics
    desc: DNA match statistics, the weight and calibration of likelihood
      ratios, kinship, paternity, pedigrees with mutation, mixtures (by the
      alleles seen and by the gamma model of peak heights) and database
      searches; trace evidence by the two-level model, glass grouping and
      transfer, and tool marks (lowess profiles, the Chumbley score and the
      CMPS score of bullet signatures).
    contents:
      - gtmp
      - lrpost
      - cllr
      - cllrmin
      - lrcal
      - tipplt
      - eceplt
      - mixlr
      - gmixlr
      - kinidx
      - patidx
      - pedlr
      - dbsrch
      - preslr
      - tlvc
      - skp
      - tfrp
      - lwss
      - chmb
      - cmpsc
  - title: Eyewitness identification
    desc: ROC curves of lineup procedures, partial areas, diagnosticity and
      confidence-accuracy, and the fairness of a lineup.
    contents:
      - lnroc
      - lnsize
  - title: Toxicology and taphonomy
    desc: Calibration lines and values below the limit of detection,
      postmortem redistribution, ethanol in a decomposed body and the
      reliability of specimen matrices; the decay chain of a body, a
      Bayesian preservation model and log-ratio transforms of element
      shares.
    contents:
      - txcal
      - lodimp
      - pmrrat
      - etohlr
      - mtxrel
      - tpdmc
      - tpbhm
      - clrilr
  - title: Policing
    desc: Clearance rates, exposure proxies, misrecorded groups and
      regression to the mean.
    contents:
      - clrsmp
      - expbnd
      - misrd
      - rtmhs
  - title: Corrections
    desc: Incapacitation, release rules, time in custody, sentence effects
      and hazards after selection.
    contents:
      - incap
      - incapr
      - sellab
      - losbnd
      - sntbnd
      - mtrbnd
      - hzdsel
  - title: Networks
    desc: Co-offending graphs, centrality, cores, components, communities,
      brokerage and the Cheeger bounds.
    contents:
      - coofg
      - ntdeg
      - ntbtw
      - ntcls
      - ntevc
      - ntcore
      - ntcmp
      - ntlvn
      - ntmod
      - ntbrk
      - ntchg
  - title: Spatial
    desc: Distances and projection, centrography, nearest neighbours and K
      functions, hot spots, space-time tests, journey to crime and the
      geographic profile of a series; the Gi* statistic on a grid and
      the point pattern test of two sets of counts.
    contents:
      - hvdist
      - eqproj
      - cgstat
      - cgmedn
      - webpt
      - sdell
      - cvhull
      - nnidx
      - ripk
      - ripenv
      - fzmode
      - kmpart
      - nnhclu
      - stacel
      - rnnhcl
      - hdbang
      - crwalk
      - mantst
      - stmavg
      - jtdecay
      - jtsurf
      - jtcal
      - jtacc
      - bjtc
      - crchyp
      - hitscr
      - spwt
      - gearc
      - gorg
      - lmorn
      - locgi
      - dirmn
      - gstr
      - sptst
  - title: Risk tools and predictive policing
    desc: Fairness metrics of a binary risk tool by group; differences
      between groups with intervals, over time and place;
      calibration of an area ranking and a score's spread across groups;
      individual fairness; bounds under label noise, Chouldechova's
      identity and the resolution of a ranking; the Oaxaca-Blinder
      decomposition; simulated records with a known disparity.
    contents:
      - fairdf
      - tmpaud
      - calaud
      - scrdsp
      - lipaud
      - nsbnd
      - impfpr
      - rnkres
      - oaxbd
      - fairsim
      - nordet
      - fair
  - title: Checks
    desc: Which labelling of a table reproduces a reported contrast, and an
      audit of categorical inputs.
    contents:
      - relchk
      - catchk
  - title: Counts, rates and tables
    desc: Rate ratios from count regression with exposure and clusters;
      rates and proportions by group with exact and approximate intervals;
      direct and indirect standardisation; cross-tabulation with tests
      and measures of association.
    contents:
      - cntreg
      - grprr
      - dastd
      - sirex
      - ctabx
  - title: Police-reported crime
    desc: Severity-weighted crime indices and composite indices of standardised
      counts; Benford screens of reported figures and agencies that report
      the same count every month.
    contents:
      - crsev
      - zcomp
      - rptvic
      - bdig
      - rptc
  - title: Concentration
    desc: How unequally crime is spread across places, people or units, what
      chance alone would show, and the tail of a heavy-tailed count.
    contents:
      - cconc
      - hilltl
  - title: Dark figure
    desc: Capture-recapture from two or three lists, and bounds on the crime
      that is never recorded.
    contents:
      - crcap
      - dkfig
  - title: Published tables
    desc: Banded categories, the bounds that rounding and suppression leave, and
      period-over-period change with exact tests.
    contents:
      - bandx
      - pbbnd
      - yoypx
  - title: Courts and sentencing
    desc: The judge-leniency instrument and its monotonicity, and sentences
      against a mandatory minimum.
    contents:
      - jdgiv
      - jmono
      - mmshr
  - title: Life course and the justice pipeline
    desc: Age-crime curves of a mixture of types, the cumulative risk of a first
      event by age, and lagged rates between stages; group-based
      trajectory models (zero-inflated Poisson and multivariate normal).
    contents:
      - agemix
      - cumrsk
      - apcie
      - jpipe
      - zgll
      - mvtll
  - title: Segregation and the Mandela Rules
    desc: Placements that meet the Mandela Rules' limits on solitary
      confinement, by group and denominator.
    contents:
      - mndla
  - title: Custody and court flow
    desc: Stocks and flows of people held, lengths of stay, Little's law on a
      docket, case flow and outcome mix, life tables of grouped times, and
      moves between states.
    contents:
      - stkflw
      - lostay
      - bklog
      - dktflw
      - lftab
      - trnmat
  - title: Presets
    desc: A published dataset's columns onto a generic function's arguments.
    contents:
      - clprep
  - title: Learning
    desc: The elastic net with cross-validation, logistic regression,
      random forests and their stack, the super learner; the learners of
      the cross-fitted estimators.
    contents:
      - enpath
      - lgtreg
      - rfor
      - suplrn
  - title: Causal estimates
    desc: Double machine learning by cross-fitting, with the learners above;
      augmented inverse probability weighting and targeted maximum
      likelihood from the same nuisances; Rosenbaum bounds on the
      sensitivity of a matched comparison.
    contents:
      - dmlx
      - cbatt
      - smdbal
      - evlx
      - rswp
  - title: Policy evaluation
    desc: Difference in differences with fixed effects, event studies,
      staggered adoption, synthetic controls and synthetic difference in
      differences.
    contents:
      - didfe
      - evtst
      - stgdid
      - synthc
      - sdidx
      - wcbx
      - wystep
  - title: Time, contagion and operations
    desc: Self-exciting processes, trends and change points in series,
      recurrence, hot-spot dynamics and patrol queues; aoristic weights of
      events known only within an interval.
    contents:
      - hwkfit
      - hwkres
      - hwksim
      - trndrr
      - stpcp
      - cusrv
      - xcser
      - kmrec
      - spcure
      - hypq
      - sqrtlw
      - sdbsim
      - sdbthr
      - etasf
      - mvhwk
      - sthwk
      - aorwt
  - title: Deterrence
    desc: Offending under the certainty and severity of sanction, what a
      design identifies, the inspection game and its phases, and the
      collider bias of arrest data.
    contents:
      - detrsp
      - dtrid
      - inspg
      - insphs
      - colarr
  - title: Surveys
    desc: Design-based means, totals, proportions, ratios and variances by
      domain from stratified, clustered and weighted samples.
    contents:
      - svymx
  - title: Proofs
    contents:
      - proof
  - title: Package
    contents:
      - crimlab-package
  - title: Spatial crime analysis
    desc: Near repeats, kernel surfaces, DBSCAN and hot-spot persistence,
      the space-time scan, global and bivariate Moran, spatial regression
      and its effects, point patterns and segregation, points in polygons,
      areal and boundary crosswalks, synthetic exposure from a survey,
      buffer designs and the risk terrain model.
    contents:
      - knxnr
      - kdsurf
      - dbscn
      - hsper
      - ebshr
      - kscan
      - gmoran
      - bvmor
      - sarml
      - spill
      - crossk
      - qdrtst
      - morsta
      - dissix
      - pinpl
      - arwt
      - bndxw
      - synexp
      - bufas
      - wdqx
      - prohs
      - lnkpr
      - hsacc
      - rtmfit
  - title: Search and rescue
    desc: Koopman's search theory as search and rescue planning uses it -
      lateral range curves and sweep width, the probability of detection
      from coverage and of parallel sweeps with navigation error, the
      probability of success with Bayesian updating, datum probability maps,
      the optimal allocation of effort, Frost's optimal search squares and
      the figures of his book.
    contents:
      - ltrlrng
      - optsqr
      - srchfig
  - title: Air pollution
    desc: Environmental criminology in its two senses. Pollution as harm
      and offence (green criminology) - who bears the exposure from an
      emitting site and the burden it causes, by area and by income; and
      the environment as a driver of offending and victimisation, where
      exposure series are joined to crime counts by place and day.
      Dispersion models (Pasquill-Gifford sigmas, Briggs plume rise, the
      Gaussian plume and puff, a grid and a particle model), the
      concentration-response functions of PM2.5 and NO2, the attributable
      fraction, deaths avoided, the burden by area and the concentration
      index of exposure by income.
    contents:
      - pgsig
      - plmfld
      - crfpm25
      - attrfrac
      - mortdisp
      - polbrdn
      - polbrdarea
      - expconcidx
