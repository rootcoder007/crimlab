  - title: Shares
    desc: Each count as a share of its total, with Wilson intervals that stay inside 0 to 100.
    contents:
      - shrs
  - title: Categorical integrity
    desc: Category codes decoded and recoded by name, never by position, each recode proved by a cross-tabulation and checked against the counts a release published.
