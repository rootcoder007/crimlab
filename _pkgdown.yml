  - title: Deterrence
    desc: Offending under the certainty and severity of sanction, what a
      design identifies, the inspection game and its phases, and the
      collider bias of arrest data.
    contents:
      - detrsp
      - dtrid
      - inspg
      - insphs
      - colarr
  - title: Surveys
    desc: Design-based means, totals, proportions, ratios and variances by
      domain from stratified, clustered and weighted samples.
    contents:
      - svymx
  - title: Proofs
    contents:
      - proof
  - title: Package
    contents:
      - crimlab-package
      - hwpwr
  - title: Spatial crime analysis
    desc: Near repeats, kernel surfaces, DBSCAN and hot-spot persistence,
      the space-time scan, global and bivariate Moran, spatial regression
      and its effects, point patterns and segregation, points in polygons,
      areal and boundary crosswalks, synthetic exposure from a survey,
      buffer designs and the risk terrain model.
