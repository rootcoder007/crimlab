url: https://rootcoder007.github.io/crimlab/
repo:
  url:
    home: https://github.com/rootcoder007/crimlab/
    source: https://github.com/rootcoder007/crimlab/blob/main/
    issue: https://github.com/rootcoder007/crimlab/issues/
template:
  bootstrap: 5

articles:
  - title: Guides
    navbar: ~
    contents:
      - crimlab

reference:
  - title: Disparities
    desc: Veil of darkness, odds ratios and risks, the outcome test,
      benchmarks and dyadic rates.
    contents:
      - vodtst
      - orrisk
      - outtst
      - thrtst
      - ibench
      - dspbm
      - dyadrt
  - title: Forensics
    desc: DNA match statistics, the weight and calibration of likelihood
      ratios, kinship, paternity, pedigrees with mutation, mixtures (by the
      alleles seen and by the gamma model of peak heights) and database
      searches; trace evidence by the two-level model, glass grouping and
      transfer, and tool marks (lowess profiles, the Chumbley score and the
      CMPS score of bullet signatures).
    contents:
      - gtmp
      - lrpost
      - cllr
      - cllrmin
      - lrcal
      - tipplt
      - eceplt
      - mixlr
      - gmixlr
      - kinidx
      - patidx
      - pedlr
      - dbsrch
      - preslr
      - tlvc
      - skp
      - tfrp
      - lwss
      - chmb
      - cmpsc
  - title: Eyewitness identification
    desc: ROC curves of lineup procedures, partial areas, diagnosticity and
      confidence-accuracy, and the fairness of a lineup.
    contents:
      - lnroc
      - lnsize
  - title: Toxicology and taphonomy
    desc: Calibration lines and values below the limit of detection,
      postmortem redistribution, ethanol in a decomposed body and the
      reliability of specimen matrices; the decay chain of a body, a
      Bayesian preservation model and log-ratio transforms of element
      shares.
    contents:
      - txcal
      - lodimp
      - pmrrat
      - etohlr
      - mtxrel
      - tpdmc
      - tpbhm
      - clrilr
      - dirsim
  - title: Policing
    desc: Clearance rates, exposure proxies, misrecorded groups and
      regression to the mean.
    contents:
      - clrsmp
      - expbnd
      - misrd
      - rtmhs
  - title: Corrections
    desc: Incapacitation, release rules, time in custody, sentence effects
      and hazards after selection.
    contents:
      - incap
      - incapr
      - sellab
      - losbnd
      - sntbnd
      - mtrbnd
      - hzdsel
  - title: Networks
    desc: Co-offending graphs, centrality, cores, components, communities,
      brokerage and the Cheeger bounds.
    contents:
      - coofg
      - ntdeg
      - ntbtw
      - ntcls
      - ntevc
      - ntcore
      - ntcmp
      - ntlvn
      - ntmod
      - ntbrk
      - ntchg
