  - title: Search and rescue
    desc: Koopman's search theory as search and rescue planning uses it -
      lateral range curves and sweep width, the probability of detection
      from coverage and of parallel sweeps with navigation error, the
      probability of success with Bayesian updating, datum probability maps,
      the optimal allocation of effort, Frost's optimal search squares and
      the figures of his book.
    contents:
      - ltrlrng
      - optsqr
      - srchfig
  - title: Air pollution
    desc: Environmental criminology in its two senses. Pollution as harm
      and offence (green criminology) - who bears the exposure from an
      emitting site and the burden it causes, by area and by income; and
      the environment as a driver of offending and victimisation, where
      exposure series are joined to crime counts by place and day.
      Dispersion models (Pasquill-Gifford sigmas, Briggs plume rise, the
      Gaussian plume and puff, a grid and a particle model), the
      concentration-response functions of PM2.5 and NO2, the attributable
      fraction, deaths avoided, the burden by area and the concentration
      index of exposure by income.
    contents:
      - pgsig
      - plmfld
      - crfpm25
      - attrfrac
      - mortdisp
      - polbrdn
      - polbrdarea
      - expconcidx
      - exprspplr
      - vrfpol
  - title: Exposure and crime
    desc: Environmental criminology asks how the places and conditions in
      which people live and move shape offending and victimisation. These
      functions estimate the effect of a daily exposure such as air
      pollution on counts by place and day, with fixed effects, wind and
      inversion instruments, an irrelevant-day placebo and the upwind and
      downwind design, after Bondy, Roth and Sager (2020, Crime is in the
      air, Journal of the Association of Environmental and Resource
      Economists 7(3), doi:10.1086/707127) and Herrnstadt, Heyes,
      Muehlegger and Saberian (2019, Air pollution as a cause of violent
      crime; 2021, Air pollution and criminal activity, American Economic
      Journal - Applied Economics 13(4), doi:10.1257/app.20190091).
    contents:
      - ppmlfe
      - ivfe
      - ppmlcf
      - expgmm
      - windiv
      - invsn
      - dwnexp
      - tailwd
      - plcday
      - updwn
      - expjn
      - smkiv
      - exprun
      - hetfx
      - ccross
      - jntx
      - dosebin
      - typefx
      - idwint
      - gtwreg
      - asrule
      - ifesc
      - lrcce
      - cemtch
      - olsdx
  - title: Regression discontinuity
    desc: >
      Local polynomial fits at a cutoff with the bandwidth of Imbens and
      Kalyanaraman (2012), robust intervals after Calonico, Cattaneo and
      Titiunik (2014), placebo cutoffs and the density test of McCrary
      (2008).
    contents:
      - rdloc
      - rddens
  - title: Environmental crime
    desc: "Offences against the environment as the outcome: where, when and
      why pollution offences, illegal waste disposal and safety crimes are
      recorded, and how enforcement shapes the counts. The LMDI
      decomposition of a count over a Kaya identity, two-way fixed effects
      with an interaction and its checks, Pesaran's CD test of a panel,
      difference and system GMM for dynamic panels, Wooldridge's test of
      serial correlation and common correlated effects."
    contents:
      - lmdix
      - fepnl
      - pcdtst
      - gmmpnl
      - wsctst
      - ccepnl
  - title: Data larger than memory
    desc: One-pass summaries for data that arrive in pieces or do not fit
      in memory - moments accumulated and merged exactly, a uniform
      reservoir sample of a stream, and the HyperLogLog count of distinct
      values in fixed memory.
    contents:
      - onlsmry
      - rsvidx
      - dstnskch
  - title: Geostatistics
    desc: Semivariograms and their models, point and block kriging with
