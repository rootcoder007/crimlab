[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crimlab"
dynamic = ["version"]
description = "Statistical Toolkit for Criminology and Sociolegal Research"
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Vansh Singh Ruhela" }]
keywords = ["statistics", "criminology", "sociolegal", "forensics", "policing", "courts", "corrections", "sentencing", "disparity", "likelihood ratio", "causal inference", "spatial statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Sociology",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://crimlab.dev/"
Repository = "https://github.com/rootcoder007/crimlab"
Issues = "https://github.com/rootcoder007/crimlab/issues"
Citation = "https://github.com/rootcoder007/crimlab/blob/main/CITATION.cff"

[tool.setuptools]
packages = ["crimlab", "crimlab.lean"]

[tool.setuptools.package-data]
crimlab = ["py.typed", "*.pyi"]
"crimlab.lean" = ["*.lean"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE"]
